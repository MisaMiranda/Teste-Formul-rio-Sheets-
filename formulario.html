<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Formulário de Contato</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0e0e0e;
      --surface: #161616;
      --border: #2a2a2a;
      --accent: #c8a96e;
      --accent-dim: rgba(200, 169, 110, 0.12);
      --text: #f0ece4;
      --muted: #7a7570;
      --error: #e07070;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      position: relative;
      overflow: hidden;
    }

    /* Background decorative lines */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        repeating-linear-gradient(
          90deg,
          transparent,
          transparent 79px,
          rgba(255,255,255,0.025) 79px,
          rgba(255,255,255,0.025) 80px
        );
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 520px;
    }

    /* Header */
    .header {
      margin-bottom: 2.5rem;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 0.6s ease forwards;
    }

    .label-tag {
      display: inline-block;
      font-size: 0.65rem;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 0.25rem 0.7rem;
      border-radius: 2px;
      margin-bottom: 1rem;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 5vw, 2.8rem);
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    h1 span {
      color: var(--accent);
      font-style: italic;
    }

    .subtitle {
      margin-top: 0.6rem;
      font-size: 0.875rem;
      color: var(--muted);
      font-weight: 300;
      letter-spacing: 0.01em;
    }

    /* Form card */
    .form-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2.5rem;
      opacity: 0;
      transform: translateY(24px);
      animation: fadeUp 0.6s ease 0.15s forwards;
    }

    .field {
      margin-bottom: 1.75rem;
      position: relative;
    }

    label {
      display: block;
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.6rem;
      transition: color 0.2s;
    }

    .field:focus-within label {
      color: var(--accent);
    }

    input {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--border);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      font-weight: 300;
      padding: 0.6rem 0;
      outline: none;
      transition: border-color 0.25s;
      caret-color: var(--accent);
    }

    input::placeholder { color: #3a3a3a; }

    input:focus {
      border-bottom-color: var(--accent);
    }

    /* Animated underline */
    .underline {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 1px;
      width: 0;
      background: var(--accent);
      transition: width 0.3s ease;
    }

    .field:focus-within .underline { width: 100%; }

    .field-icon {
      position: absolute;
      right: 0;
      bottom: 10px;
      color: var(--border);
      font-size: 0.85rem;
      transition: color 0.2s;
      pointer-events: none;
    }

    .field:focus-within .field-icon { color: var(--accent); }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin: 2rem 0;
    }

    .divider-line {
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .divider span {
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      color: var(--muted);
      text-transform: uppercase;
    }

    /* Button */
    button[type="submit"] {
      width: 100%;
      background: var(--accent);
      color: #0e0e0e;
      border: none;
      border-radius: 2px;
      padding: 1rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: opacity 0.2s, transform 0.15s;
    }

    button[type="submit"]::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0);
      transition: background 0.2s;
    }

    button[type="submit"]:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    button[type="submit"]:active {
      transform: translateY(0);
    }

    /* Success state */
    .success-msg {
      display: none;
      text-align: center;
      padding: 2rem 0 0.5rem;
    }

    .success-msg .icon {
      font-size: 2rem;
      margin-bottom: 0.75rem;
    }

    .success-msg p {
      font-family: 'Playfair Display', serif;
      font-size: 1.15rem;
      color: var(--accent);
    }

    .success-msg small {
      color: var(--muted);
      font-size: 0.8rem;
      display: block;
      margin-top: 0.4rem;
    }

    /* Footer */
    .footer-note {
      margin-top: 1.5rem;
      text-align: center;
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.04em;
      opacity: 0;
      animation: fadeUp 0.6s ease 0.3s forwards;
    }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    /* Accent dot decoration */
    .dot-accent {
      display: inline-block;
      width: 6px;
      height: 6px;
      background: var(--accent);
      border-radius: 50%;
      margin-right: 0.5rem;
      vertical-align: middle;
    }
  </style>
</head>
<body>

<div class="container">

  <div class="header">
    <div class="label-tag">Contato</div>
    <h1>Fale <span>conosco</span></h1>
    <p class="subtitle">Preencha os campos abaixo e entraremos em contato em breve.</p>
  </div>

  <div class="form-card">
    <form id="contactForm" novalidate>

      <div class="field">
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" name="nome" placeholder="Ex: Maria Silva" autocomplete="name" required />
        <div class="underline"></div>
        <span class="field-icon">✦</span>
      </div>

      <div class="field">
        <label for="numero">Número / Telefone</label>
        <input type="tel" id="numero" name="numero" placeholder="(11) 99999-9999" autocomplete="tel" required />
        <div class="underline"></div>
        <span class="field-icon">✦</span>
      </div>

      <div class="field">
        <label for="email">Endereço de e-mail</label>
        <input type="email" id="email" name="email" placeholder="maria@email.com" autocomplete="email" required />
        <div class="underline"></div>
        <span class="field-icon">✦</span>
      </div>

      <div class="divider">
        <div class="divider-line"></div>
        <span>enviar</span>
        <div class="divider-line"></div>
      </div>

      <button type="submit">Enviar mensagem</button>

      <div class="success-msg" id="successMsg">
        <div class="icon">✦</div>
        <p>Mensagem enviada!</p>
        <small>Obrigado, entraremos em contato em breve.</small>
      </div>

    </form>
  </div>

  <p class="footer-note">
    <span class="dot-accent"></span>Seus dados estão protegidos e não serão compartilhados.
  </p>

</div>

<script>
  function formatPhone(e) {
    var v = e.target.value.replace(/\D/g, '');
    if (v.length > 11) v = v.slice(0, 11);

    if (v.length > 7) {
      var limit = v.length <= 10 ? 6 : 7;
      v = '(' + v.slice(0, 2) + ') ' + v.slice(2, limit) + '-' + v.slice(limit);
    } else if (v.length > 2) {
      v = '(' + v.slice(0, 2) + ') ' + v.slice(2);
    } else if (v.length > 0) {
      v = '(' + v;
    }

    e.target.value = v;
  }

  var SUPABASE_URL = 'https://qqojsjbrurxaydalsoyd.supabase.co';
  var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFxb2pzamJydXJ4YXlkYWxzb3lkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM3ODkzODUsImV4cCI6MjA4OTM2NTM4NX0.sum2vu21dl1eJhVXQJsF-sLaFv1xOir5cuUAUiPMkdU';

  function handleSubmit(e) {
    e.preventDefault();
    var btn = document.querySelector('button[type="submit"]');
    btn.textContent = 'Enviando...';
    btn.disabled = true;

    var payload = JSON.stringify({
      nome: document.getElementById('nome').value,
      numero: document.getElementById('numero').value,
      email: document.getElementById('email').value
    });

    fetch(SUPABASE_URL + '/rest/v1/Contatos', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + SUPABASE_KEY,
        'Prefer': 'return=minimal'
      },
      body: payload
    }).then(function(res) {
      console.log('Status:', res.status);
      return res.text().then(function(text) {
        console.log('Resposta:', text);
        if (res.ok || res.status === 201) {
          document.body.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0e0e0e;padding:2rem;"><div id="sp" style="text-align:center;max-width:460px;opacity:0;transform:translateY(24px);transition:all 0.7s ease;"><p style="font-family:Playfair Display,serif;font-size:1.6rem;color:#f0ece4;line-height:1.6;">Formulário preenchido com sucesso! Logo entraremos em contato. 😊</p></div></div>';
          setTimeout(function(){ var el=document.getElementById('sp'); if(el){el.style.opacity='1';el.style.transform='translateY(0)';} }, 60);
        } else {
          console.log('Erro status:', res.status, text);
          btn.textContent = 'Erro ao enviar. Tente novamente.';
          btn.disabled = false;
        }
      });
    }).catch(function(err) {
      console.log('Erro catch:', err);
      btn.textContent = 'Erro ao enviar. Tente novamente.';
      btn.disabled = false;
    });
  }

  document.getElementById('numero').addEventListener('input', formatPhone);
  document.getElementById('contactForm').addEventListener('submit', handleSubmit);
</script>

</body>
</html>
